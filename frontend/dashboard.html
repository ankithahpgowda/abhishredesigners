<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Abhishre Designers</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="public/css/style.css">
    <style>
        body { background-color: #f9f9f9; font-family: 'Poppins', sans-serif; }
        .dashboard-header { background: #111; color: #fff; padding: 1.5rem 0; border-bottom: 3px solid #D4AF37; }
        .sidebar { background: #fff; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .sidebar-link { display: block; padding: 10px 15px; color: #555; text-decoration: none; border-radius: 8px; margin-bottom: 5px; transition: 0.3s; }
        .sidebar-link:hover, .sidebar-link.active { background: #fdfaf2; color: #D4AF37; font-weight: 500; }
        .content-card { background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .luxury-btn { background: #D4AF37; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 500; }
        .luxury-btn:hover { background: #b8962c; color: #fff; }
    </style>
</head>
<body>

    <div class="dashboard-header">
        <div class="container d-flex justify-content-between align-items-center">
            <h3 class="m-0" style="font-family: 'Playfair Display', serif;">ABHISHREE <span style="font-size:1rem; color:#D4AF37;">| Customer Portal</span></h3>
            <button class="btn btn-outline-light btn-sm" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </div>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-3">
                <div class="sidebar">
                    <h5 class="fw-bold mb-4">Dashboard</h5>
                    <a href="#" class="sidebar-link active"><i class="fas fa-user me-2"></i> My Profile</a>
                    <a href="#" class="sidebar-link"><i class="fas fa-shopping-bag me-2"></i> My Orders</a>
                    <a href="#" class="sidebar-link"><i class="fas fa-map-marker-alt me-2"></i> Saved Addresses</a>
                    <a href="#" class="sidebar-link"><i class="fas fa-cog me-2"></i> Account Settings</a>
                </div>
            </div>
            <div class="col-md-9">
                <div class="content-card">
                    <h4 class="fw-bold mb-4" style="font-family: 'Playfair Display', serif;">Welcome, <span id="userName" style="color:#D4AF37;">...</span></h4>
                    
                    <div class="row g-4">
                        <div class="col-md-6">
                            <div class="p-3 border rounded">
                                <p class="text-muted small mb-1">Mobile Number</p>
                                <h6 class="fw-bold" id="userPhone">...</h6>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="p-3 border rounded">
                                <p class="text-muted small mb-1">Email Address</p>
                                <h6 class="fw-bold" id="userEmail">...</h6>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="p-3 border rounded">
                                <p class="text-muted small mb-1">Account Status</p>
                                <h6 class="fw-bold text-success" id="userStatus">Verified</h6>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mt-5 text-center p-5 border rounded bg-light">
                        <i class="fas fa-box-open fa-3x text-muted mb-3"></i>
                        <h5>No Orders Yet</h5>
                        <p class="text-muted">Looks like you haven't placed any orders.</p>
                        <button class="luxury-btn mt-2">Start Shopping</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Check Auth
        const token = localStorage.getItem('auth_token');
        if (!token) {
            window.location.href = '/auth.html';
        }

        // Fetch Profile
        async function loadProfile() {
            try {
                const res = await fetch('/api/auth/profile', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                if (res.status === 401 || res.status === 403) {
                    logout();
                    return;
                }

                const data = await res.json();
                document.getElementById('userName').textContent = data.name;
                document.getElementById('userPhone').textContent = data.phone;
                document.getElementById('userEmail').textContent = data.email || 'Not provided';
            } catch (err) {
                console.error('Error loading profile');
            }
        }

        function logout() {
            localStorage.removeItem('auth_token');
            window.location.href = '/auth.html';
        }

        loadProfile();
    </script>
</body>
</html>
