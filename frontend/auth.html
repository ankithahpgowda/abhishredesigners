<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Portal | Abhishre Designers</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="public/css/style.css">
    <style>
        body { background-color: #fcfbf9; }
        .auth-container { max-width: 450px; margin: 4rem auto; }
        .auth-card { background: #fff; border-radius: 12px; padding: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid rgba(212, 175, 55, 0.2); }
        .auth-tabs { display: flex; border-bottom: 2px solid #eee; margin-bottom: 1.5rem; }
        .auth-tab { flex: 1; text-align: center; padding: 0.75rem; cursor: pointer; font-weight: 500; color: #888; transition: 0.3s; }
        .auth-tab.active { color: #D4AF37; border-bottom: 2px solid #D4AF37; }
        .luxury-input { border: 1px solid #ddd; padding: 12px; border-radius: 8px; width: 100%; margin-bottom: 1rem; font-family: 'Poppins', sans-serif; }
        .luxury-input:focus { border-color: #D4AF37; box-shadow: 0 0 0 0.2rem rgba(212, 175, 55, 0.25); outline: none; }
        .btn-gold { background: #D4AF37; color: #fff; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: 600; transition: 0.3s; }
        .btn-gold:hover { background: #b8962c; color: #fff; }
        .btn-outline-gold { background: transparent; color: #D4AF37; border: 1px solid #D4AF37; padding: 12px; border-radius: 8px; width: 100%; font-weight: 600; transition: 0.3s; }
        .btn-outline-gold:hover { background: #D4AF37; color: #fff; }
        .hidden { display: none !important; }
        .error-text { color: #dc3545; font-size: 0.85rem; margin-top: -0.5rem; margin-bottom: 1rem; display: block; }
        .success-text { color: #198754; font-size: 0.85rem; margin-top: -0.5rem; margin-bottom: 1rem; display: block; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <h1 class="logo-text m-0" style="font-size: 1.5rem; color: #D4AF37;">ABHISHREE</h1>
            </a>
        </div>
    </nav>

    <div class="container auth-container">
        <div class="auth-card">
            <div class="text-center mb-4">
                <h3 class="fw-bold" style="font-family: 'Playfair Display', serif;">Welcome Back</h3>
                <p class="text-muted small">Sign in or create an account</p>
            </div>

            <div class="auth-tabs">
                <div class="auth-tab active" id="tab-login" onclick="switchTab('login')">Login</div>
                <div class="auth-tab" id="tab-register" onclick="switchTab('register')">Register</div>
            </div>

            <!-- LOGIN SECTION -->
            <div id="section-login">
                <form id="loginForm">
                    <input type="text" class="luxury-input" id="loginPhone" placeholder="Mobile Number" required>
                    <input type="password" class="luxury-input" id="loginPassword" placeholder="Password" required>
                    <span id="loginError" class="error-text"></span>
                    <button type="submit" class="btn-gold mb-3">Login with Password</button>
                    <div class="text-center mb-3 text-muted">OR</div>
                    <button type="button" class="btn-outline-gold" onclick="requestLoginOTP()">Login with OTP</button>
                    <div class="text-center mt-3">
                        <a href="#" class="text-muted small text-decoration-none">Forgot Password?</a>
                    </div>
                </form>
            </div>

            <!-- REGISTER SECTION -->
            <div id="section-register" class="hidden">
                <form id="registerForm">
                    <input type="text" class="luxury-input" id="regName" placeholder="Full Name" required>
                    <input type="text" class="luxury-input" id="regPhone" placeholder="Mobile Number" required>
                    <input type="email" class="luxury-input" id="regEmail" placeholder="Email Address (Optional)">
                    <input type="password" class="luxury-input" id="regPassword" placeholder="Password" required>
                    <input type="password" class="luxury-input" id="regConfirmPassword" placeholder="Confirm Password" required>
                    <span id="regError" class="error-text"></span>
                    <button type="submit" class="btn-gold">Create Account</button>
                </form>
            </div>

            <!-- OTP VERIFICATION SECTION (Hidden initially) -->
            <div id="section-otp" class="hidden text-center">
                <h5 class="fw-bold mb-3">Verify OTP</h5>
                <p class="small text-muted mb-4">We've sent a 6-digit code to your mobile number.</p>
                <form id="otpForm">
                    <input type="text" class="luxury-input text-center fs-4 tracking-wider" id="otpInput" placeholder="------" maxlength="6" required>
                    <span id="otpError" class="error-text"></span>
                    <input type="hidden" id="otpPurpose" value="">
                    <input type="hidden" id="otpPhone" value="">
                    <button type="submit" class="btn-gold mb-3">Verify & Proceed</button>
                    <p class="small text-muted">Didn't receive it? <a href="#" id="resendOtp" style="color:#D4AF37">Resend in 30s</a></p>
                </form>
            </div>
        </div>
    </div>

    <script src="public/js/auth.js"></script>
</body>
</html>
